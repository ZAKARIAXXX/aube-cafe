  <path d="M16 8 Q16 3 16 1" stroke="url(#steam)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" style="animation-delay: 0.2s"/>
  <path d="M20 8 Q21 4 20 2" stroke="url(#steam)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" style="animation-delay: 0.4s"/>
