      <stop offset="0%" style="stop-color:#6B4A3A"/>
      <stop offset="100%" style="stop-color:#4A3428"/>
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="0%" x2="0%" y2="100%">
